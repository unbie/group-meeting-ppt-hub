{% extends 'base.html' %}{% block title %}确认覆盖 · 组会资料台{% endblock %}{% block content %}<section class="panel form-panel"><div class="page-heading"><h1>已有同名提交</h1><p>{{ date }} · {{ name }} 已有文件。请选择新文件并确认覆盖；其他人的资料不会受到影响。</p></div><form action="/upload" method="post" enctype="multipart/form-data" data-loading data-confirm="确定覆盖现有文件吗？"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="date" value="{{ date }}"><input type="hidden" name="overwrite_token" value="{{ overwrite_token }}"><div class="file-field"><span class="field-title">演示文稿</span><div class="file-picker"><input id="replacement-file" class="file-input" type="file" name="file" accept=".pptx,.ppt" required data-file-input><label for="replacement-file" class="file-trigger">选择 PPT 文件</label><span class="file-name" data-file-name aria-live="polite">未选择文件</span></div><small>支持 .pptx；旧版 .ppt 需服务器安装 LibreOffice 转换。单文件不超过 50 MB。</small></div><div class="actions"><button class="danger" type="submit">确认覆盖</button><a class="button" href="/">取消</a></div></form></section>{% endblock %}
